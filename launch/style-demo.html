<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SUBTEXT pixel style demos</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/anton-400.woff2) format('woff2'); font-weight: 400; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: 0 auto; image-rendering: pixelated; }
</style>
</head>
<body>
<!-- ?style=booth|cozy|gameboy|pico&kind=scene|faces -->
<canvas id="c" width="1080" height="1350"></canvas>
<script src="pixel.js"></script>
<script src="pixel-scenes.js"></script>
<script>
  const DEMO_MSG = { text: 'Thanks for nothing!', from: 'Kamran, Finance', time: '9:41 AM' };
  window.drawDemo = (styleKey, kind) => {
    PIX.begin(styleKey);
    if (kind === 'faces') PIXSCENES.expressionSheet();
    else PIXSCENES.booth({ expr: 'happy', msg: DEMO_MSG, stampLabel: 'gratitude', stampValue: '98%', emo: 'gratitude', says: "Aw. You're welcome." });
    PIX.present(document.getElementById('c'));
  };
  window.ready = document.fonts.load('400 21px Anton').then(() => {
    const q = new URLSearchParams(location.search);
    window.drawDemo(q.get('style') || 'booth', q.get('kind') || 'scene');
    return true;
  });
</script>
</body>
</html>
